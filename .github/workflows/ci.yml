name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  creation-store:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - run: npm ci --no-audit --no-fund
      - name: Verify store and creation page regressions
        run: >-
          npm test -- --runInBand
          src/store/__tests__/gameStore.creationSession.test.js
          src/pages/create/__tests__/create.creation-session.test.jsx
          src/components/creation/__tests__/CreationCreateWorkspace.test.jsx
      - name: Build H5 from source
        run: npm run build:h5

  deployment:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - run: bash -n scripts/aliyun/deploy.sh
      - run: python3 scripts/aliyun/test_deploy.py
      - name: Validate production Compose
        env:
          IMAGE_PREFIX: registry.example.com/gamevallies
          IMAGE_TAG: test
          RUNTIME_ENV_FILE: /tmp/runtime.env
        run: |
          touch /tmp/runtime.env
          docker compose -f deploy/aliyun/compose.yml config --quiet
      - name: Build frontend image without publishing
        run: docker build --tag gamevallies-frontend:ci .
