name: Deploy OSS packages to Alibaba FC
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      apply:
        description: Publish packages and update FC (false validates configuration only)
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: aliyun-fc-production-front
  cancel-in-progress: false
jobs:
  settings:
    runs-on: ubuntu-latest
    environment: Aliyun
    outputs:
      enabled: ${{ steps.flags.outputs.enabled }}
    steps:
      - id: flags
        env:
          ENABLED: ${{ vars.ALIYUN_FC_DEPLOY_ENABLED }}
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
        run: |
          if [ "$REF" = refs/heads/main ] && { [ "$EVENT" = workflow_dispatch ] || [ "$ENABLED" = true ]; }; then
            echo 'enabled=true' >> "$GITHUB_OUTPUT"
          else
            echo 'enabled=false' >> "$GITHUB_OUTPUT"
          fi
  verify:
    needs: settings
    if: needs.settings.outputs.enabled == 'true'
    uses: ./.github/workflows/ci.yml
  release:
    needs: verify
    runs-on: ubuntu-latest
    environment: Aliyun
    timeout-minutes: 120
    env:
      FC_API_URL: ${{ vars.FC_API_URL }}
      FC_INTERNAL_TOKEN: ${{ secrets.FC_INTERNAL_TOKEN }}
      FC_ACCOUNT_ID: ${{ vars.FC_ACCOUNT_ID }}
      FC_EXECUTION_ROLE: ${{ vars.FC_EXECUTION_ROLE }}
      FC_LOG_PROJECT: ${{ vars.FC_LOG_PROJECT }}
      FC_LOG_STORE: ${{ vars.FC_LOG_STORE }}
      ALIYUN_OSS_BUCKET: ${{ vars.ALIYUN_OSS_BUCKET }}
      CONTENT_ORIGIN: https://content.zlspace.ai
      FC_REGION: ${{ vars.FC_REGION || 'cn-shenzhen' }}
      FC_PREFIX: ${{ vars.FC_PREFIX || 'gamevallies-prod' }}
      ALIYUN_OSS_REGION: ${{ vars.ALIYUN_OSS_REGION || 'cn-shenzhen' }}
      ALIYUN_OSS_ENDPOINT: ${{ vars.ALIYUN_OSS_ENDPOINT || 'https://oss-cn-shenzhen.aliyuncs.com' }}
      ALIYUN_OSS_PREFIX: ${{ vars.ALIYUN_OSS_PREFIX || 'gamevallies/prod/' }}
      OBJECT_STORAGE_PROVIDER: ${{ vars.OBJECT_STORAGE_PROVIDER || 'aliyun-oss' }}
      PUBLIC_ORIGIN: https://zlspace.ai
      ALIBABA_CLOUD_ACCESS_KEY_ID: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_ID }}
      ALIBABA_CLOUD_ACCESS_KEY_SECRET: ${{ secrets.ALIBABA_CLOUD_ACCESS_KEY_SECRET }}
      ALIBABA_CLOUD_SECURITY_TOKEN: ${{ secrets.ALIBABA_CLOUD_SECURITY_TOKEN }}
      RELEASE_SHA: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: docker/setup-buildx-action@v3
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/fc/requirements.txt
      - name: Check individual Aliyun settings before packaging
        run: python scripts/fc/configure.py check
      - name: Build Linux ZIP packages (no registry push)
        run: bash scripts/fc/build.sh
      - name: Validate configuration and optionally publish
        env:
          APPLY: ${{ github.event_name == 'push' || inputs.apply }}
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          config=$(mktemp)
          trap 'rm -f "$config"' EXIT
          python scripts/fc/configure.py prepare --runtime "$config"
          python scripts/fc/deploy.py validate --runtime "$config"
          if [ "$APPLY" = true ]; then
            python scripts/fc/configure.py upload --runtime "$config"
            python scripts/fc/deploy.py apply --runtime "$config" --release fc-release.json
          fi
      - uses: actions/upload-artifact@v4
        if: success() && (github.event_name == 'push' || inputs.apply)
        with:
          name: fc-release-${{ github.sha }}
          path: fc-release.json
          if-no-files-found: error
          retention-days: 90
