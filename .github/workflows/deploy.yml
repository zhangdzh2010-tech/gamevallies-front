name: Deploy to Alibaba Cloud
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: aliyun-production-front
  cancel-in-progress: false
jobs:
  verify:
    if: github.ref == 'refs/heads/main' && vars.ALIYUN_DEPLOY_ENABLED == 'true'
    uses: ./.github/workflows/ci.yml
  images:
    needs: verify
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_NAMESPACE: ${{ vars.ACR_NAMESPACE }}
      ACR_USERNAME: ${{ secrets.ACR_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PASSWORD }}
      PUBLIC_ORIGIN: ${{ vars.PUBLIC_ORIGIN }}
      GAME_CONTENT_ORIGIN: ${{ vars.GAME_CONTENT_ORIGIN }}
      GAME_SHELL_ORIGIN: ${{ vars.GAME_SHELL_ORIGIN }}
      TARO_APP_ENABLE_WECHAT_H5_LOGIN: ${{ vars.TARO_APP_ENABLE_WECHAT_H5_LOGIN }}
      TARO_APP_WECHAT_OAUTH_APP_ID: ${{ vars.TARO_APP_WECHAT_OAUTH_APP_ID }}
      TARO_APP_WECHAT_OAUTH_SCOPE: ${{ vars.TARO_APP_WECHAT_OAUTH_SCOPE }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate registry configuration
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_REGISTRY:?Missing ACR_REGISTRY}" "${ACR_NAMESPACE:?Missing ACR_NAMESPACE}"
          : "${ACR_USERNAME:?Missing ACR_USERNAME}" "${ACR_PASSWORD:?Missing ACR_PASSWORD}"
          [[ "$ACR_REGISTRY" =~ ^[a-zA-Z0-9.-]+(:[0-9]+)?$ ]]
          [[ "$ACR_NAMESPACE" =~ ^[a-z0-9_-]+$ ]]
      - uses: docker/setup-buildx-action@v3
      - name: Build and push immutable release images
        shell: bash
        run: |
          set -euo pipefail
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          [[ "$PUBLIC_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Set PUBLIC_ORIGIN to the HTTPS app origin'; exit 2; }
          [[ "$GAME_CONTENT_ORIGIN" =~ ^https://[a-zA-Z0-9.-]+(:[0-9]+)?$ ]] || { echo 'Set GAME_CONTENT_ORIGIN to the HTTPS game origin'; exit 2; }
          args=()
          for service in AUTH GAME SOCIAL FEED AI; do
            args+=(--build-arg "TARO_APP_${service}_SERVICE_URL=$PUBLIC_ORIGIN")
          done
          args+=(--build-arg "TARO_APP_WS_URL=${PUBLIC_ORIGIN/https:/wss:}/ws")
          args+=(--build-arg "TARO_APP_GAME_CONTENT_URL=$GAME_CONTENT_ORIGIN")
          args+=(--build-arg "TARO_APP_GAME_SHELL_URL=${GAME_SHELL_ORIGIN:-$PUBLIC_ORIGIN}")
          args+=(--build-arg TARO_APP_ENABLE_WECHAT_H5_LOGIN --build-arg TARO_APP_WECHAT_OAUTH_APP_ID --build-arg TARO_APP_WECHAT_OAUTH_SCOPE)
          docker buildx build --platform linux/amd64 "${args[@]}" --tag "$ACR_REGISTRY/$ACR_NAMESPACE/frontend:$GITHUB_SHA" --push .
  deploy:
    needs: images
    # Only a dedicated production ECS runner may use this label.
    runs-on: [self-hosted, Linux, X64, aliyun-ecs-front]
    environment: production
    timeout-minutes: 20
    env:
      DEPLOY_ROOT: /opt/gamevallies/front
      IMAGE_PREFIX: ${{ vars.ACR_REGISTRY }}/${{ vars.ACR_NAMESPACE }}
      IMAGE_TAG: ${{ github.sha }}
      ACR_REGISTRY: ${{ vars.ACR_REGISTRY }}
      ACR_USERNAME: ${{ secrets.ACR_PULL_USERNAME }}
      ACR_PASSWORD: ${{ secrets.ACR_PULL_PASSWORD }}
      GATEWAY_BIND: ${{ vars.GATEWAY_BIND }}
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Pull and deploy on ECS
        shell: bash
        run: |
          set -euo pipefail
          : "${ACR_USERNAME:?Missing ACR_PULL_USERNAME}" "${ACR_PASSWORD:?Missing ACR_PULL_PASSWORD}"
          export DOCKER_CONFIG=$(mktemp -d)
          trap 'rm -rf "$DOCKER_CONFIG"' EXIT
          printf '%s' "$ACR_PASSWORD" | docker login "$ACR_REGISTRY" --username "$ACR_USERNAME" --password-stdin
          bash scripts/aliyun/deploy.sh
