services:
  frontend:
    image: ${IMAGE_PREFIX:?Set IMAGE_PREFIX}/frontend:${IMAGE_TAG:?Set IMAGE_TAG}
    restart: unless-stopped
    networks: [gamevallies]
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/index.html"]
      interval: 15s
      timeout: 5s
      retries: 5
    logging:
      driver: json-file
      options: {max-size: "20m", max-file: "5"}
networks:
  gamevallies:
    external: true
    name: gamevallies
